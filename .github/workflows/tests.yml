name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: "PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony: '5.4.*'
          - php: '8.4'
            symfony: '6.4.*'
          - php: '8.5'
            symfony: '7.4.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install -n --no-progress

      - name: Require target Symfony version
        run: |
          composer require --dev --no-update \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            "symfony/yaml:${{ matrix.symfony }}"
          composer update -n --no-progress -W

      - name: Composer validate
        run: composer validate --strict

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit
